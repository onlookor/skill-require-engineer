# Canonical term definitions (closed vocabulary — no drift allowed)

canonical_terms:
  conflicting_business_requirements:
    term: "Conflicting business requirements"
    definition: "Business requirements collected from multiple sources might conflict. The tension among stakeholders with different goals and constraints can lead to clashing business requirements."
    source: "Wiegers & Beatty 2013, Ch.5, pp.80-81"
    grounding: verbatim

  conflicting_user_class_requirements:
    term: "Conflicting requirements between user classes"
    definition: "Someone must resolve conflicting requirements from different user classes, reconcile inconsistencies, and arbitrate questions of scope that arise."
    source: "Wiegers & Beatty 2013, Ch.6, p.116"
    grounding: verbatim

  stakeholder_conflict:
    term: "Stakeholder conflict"
    definition: "Conflicts can arise among project stakeholders. Business requirements sometimes reflect organizational strategies or budgetary constraints that aren't apparent to users."
    note: "Users who are upset about having a new information system forced on them by management might not want to work with the software developers. Such folks are sometimes called 'loser groups' (Gause and Weinberg 1989)."
    source: "Wiegers & Beatty 2013, Ch.2, p.29"
    grounding: verbatim

  decision_authority:
    term: "Requirements decision authority"
    definition: "Early in the project, determine who the decision makers will be for requirements issues. Decisions should be made as low in the organization's hierarchy as possible by well-informed people who are close to the issues."
    source: "Wiegers & Beatty 2013, Ch.6, pp.116-117"
    grounding: verbatim

  ba_conflict_role:
    term: "BA role in conflict resolution"
    definition: "A BA can help by surfacing potential areas of conflict and differing assumptions, flagging conflicting business objectives, noting when requested features don't achieve those objectives, and facilitating conflict resolution."
    caveat: "Resolving such issues is often a political and power struggle, which lies outside the scope of this book."
    source: "Wiegers & Beatty 2013, Ch.5, p.81"
    grounding: verbatim

  user_priority_conflict_rule:
    term: "User priority as conflict resolution"
    definition: "Where there is a conflict between secondary users' requirements and those of key users, the key users take precedence."
    priority_classes:
      key_users: "They are critical to the continued success of the product. Give greater importance to requirements generated by this category of user."
      secondary_users: "They will use the product, but their opinion of it has no effect on its long-term success."
      unimportant_users: "This category of user is given the lowest priority. It includes infrequent, unauthorized, and unskilled users, as well as people who misuse the product."
    source: "Volere Template V16 §2f Priorities Assigned to Users, internal pp.13-14"
    grounding: verbatim

  value_based_negotiation:
    term: "Value-based negotiation"
    definition: "If the cost of constructing a requirement exceeds its budget, then the customer value attached to the requirement indicates how you should proceed: High-value requirements are negotiated, while low-value requirements are discarded."
    source: "Robertson, Robertson & Reed (2024), Mastering the Requirements Process 4th Ed., Ch.14, printed p.1040"
    grounding: verbatim

  ready_made_conflict:
    term: "Ready-made (OTS) solution conflict"
    definition: "When gathering requirements, you may discover requirements that conflict with the behaviour and characteristics of the OTS software. Keep in mind that the use of OTS software was mandated before the full extent of the requirements became known. In light of your discoveries, you must consider whether the OTS product is a viable choice. If the use of the OTS software is not negotiable, then the conflicting requirements must be discarded."
    strategy_note: "The mismatches are the requirements that you will need to specify so that you can decide whether to satisfy them by either modifying the OTS software or satisfying the requirement in another way or modifying the business requirements."
    source: "Volere Template V16 §3d Off-the-Shelf Software, internal pp.18-19"
    grounding: verbatim

  implementation_environment_conflict:
    term: "Implementation environment conflict"
    definition: "The intention is to discover early any potential conflicts that might otherwise not be realized until implementation time."
    content: "A description of how the new product will affect the current implementation environment. This section should also cover things that the new product should not do."
    considerations: "Is it possible that the new system might damage some existing system? Can people be displaced or otherwise affected by the new system?"
    source: "Volere Template V16 §20a Effects on the Current Environment, internal pp.68-69"
    grounding: verbatim

  stakeholder_conflict_agreement:
    term: "Stakeholder conflict agreement"
    definition: "Agreement on how to address conflicts between stakeholders who have an interest in the same knowledge."
    note: "Required per stakeholder/knowledge combination in the stakeholder map; a prerequisite artifact before elicitation, not a resolution technique."
    source: "Volere Template V16 §2 The Stakeholders, internal p.10"
    grounding: verbatim

  conflicts_field:
    term: "Conflicts field (Volere requirement template)"
    definition: "Every requirement carries a dedicated Conflicts: field alongside Originator, Fit Criterion, Customer Satisfaction, Customer Dissatisfaction, and Dependencies. Conflicts are recorded per requirement at authoring time, not only detected at review time."
    agent_protocol: "When writing or reviewing requirements under the Volere template, the Conflicts field must be populated; empty means no known conflicts; any discovered conflict must name the conflicting requirement id."
    source: "Volere Template V16 requirement template example, internal p.42"
    grounding: verbatim

# Dispute resolution rules (machine-usable lookup)

dispute_resolution_rules:
  - disagreement: "Individual users"
    resolution: "Product champion or product owner decides"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "User classes"
    resolution: "Favored user class gets preference"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "Market segments"
    resolution: "Segment with greatest impact on business success gets preference"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "Corporate customers"
    resolution: "Business objectives dictate direction"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "Users and user managers"
    resolution: "Product owner or product champion for the user class decides"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "Development and customers"
    resolution: "Customers get preference, but in alignment with business objectives"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

  - disagreement: "Development and marketing"
    resolution: "Marketing gets preference"
    source: "Wiegers & Beatty 2013, Ch.6, p.117, Table 6-3"
    grounding: verbatim

# Conflict types taxonomy

conflict_types:
  - type: "business_objective_conflict"
    description: "Different stakeholders have incompatible business goals"
    example: "Customer wants less time purchasing; retailer wants customers to linger and spend more"
    resolution_authority: "Project decision makers"
    source: "Wiegers & Beatty 2013, Ch.5, pp.80-81"
    grounding: verbatim

  - type: "user_class_conflict"
    description: "Requirements from different user classes contradict each other"
    resolution_authority: "Per dispute_resolution_rules table"
    source: "Wiegers & Beatty 2013, Ch.6, pp.116-117"
    grounding: verbatim

  - type: "stakeholder_political_conflict"
    description: "Organizational strategies or budgetary constraints create friction between stakeholders"
    resolution_authority: "Management / executive sponsor"
    source: "Wiegers & Beatty 2013, Ch.2, p.29"
    grounding: verbatim

  - type: "ready_made_solution_conflict"
    description: "Requirements conflict with behavior of selected COTS/OTS component"
    resolution_authority: "If COTS is non-negotiable, discard conflicting requirements"
    source: "Volere Template V16 §3d Off-the-Shelf Software, internal pp.18-19"
    grounding: verbatim

  - type: "implementation_environment_conflict"
    description: "New system conflicts with existing installed systems or environment limitations"
    resolution_authority: "Technical architecture team + project management"
    source: "Volere Template V16 §20a Effects on the Current Environment, internal pp.68-69"
    grounding: verbatim

# Anti-patterns (error modes + diagnostics)

anti_patterns:
  - pattern: "Defaulting to developer/analyst decisions"
    diagnostic: "If it's not clear who is responsible for making these decisions or if the authorized individuals abdicate their responsibilities, the decisions will fall to the developers or analysts by default. Most of them don't have the necessary knowledge and perspective to make the best business decisions."
    source: "Wiegers & Beatty 2013, Ch.6, p.116"

  - pattern: "Deferring to loudest voice or highest rank"
    diagnostic: "Analysts sometimes defer to the loudest voice they hear or to the person highest on the food chain. Though understandable, this is not the best strategy."
    source: "Wiegers & Beatty 2013, Ch.6, p.117"

  - pattern: "The customer is always right fallacy"
    diagnostic: "Don't justify doing whatever any customer demands because 'The customer is always right.' We all know the customer is not always right. Sometimes, a customer is unreasonable, uninformed, or in a bad mood."
    source: "Wiegers & Beatty 2013, Ch.6, p.117"

  - pattern: "Indecision and endless wrangling"
    diagnostic: "The team needs to decide who will be making decisions on the project's requirements before they confront these types of issues. Otherwise, indecision and the revisiting of previous decisions can stall the project in endless wrangling."
    source: "Wiegers & Beatty 2013, Ch.6, p.117"

  - pattern: "Expecting the software team to resolve political conflicts"
    diagnostic: "The project's decision makers shouldn't expect the software team to resolve conflicts among various stakeholders. Resolving such issues is often a political and power struggle."
    source: "Wiegers & Beatty 2013, Ch.5, p.81"
